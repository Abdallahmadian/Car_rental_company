<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Ride - Gear Galaxy</title>
    <link rel="stylesheet" href="global.css">
</head>
<body>
    <nav class="navbar">
        <div class="main-container container">
            <a href="index4.html" class="logo">GEAR GALAXY</a>
            <div>
                <a href="index4.html">Home</a>
                <a href="index5.html">Rent Now</a>
                <a href="customer-history.html">History</a>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="card" style="max-width: 600px; margin: 40px auto;">
            <h2>Booking Details</h2>
            <div style="display: flex; flex-direction: column; gap: 20px;">
                <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 10px;">
                    <span style="font-weight: bold;">Booking ID:</span>
                    <span id="bookingId" style="color: var(--text-muted); font-weight: 600;">-</span>
                </div>
                
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <label for="StartDate">Start Date</label>
                    <input type="date" id="StartDate" required>
                </div>

                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <label for="EndDate">End Date</label>
                    <input type="date" id="EndDate" required>
                </div>

                <div style="display: flex; justify-content: space-between; background: #f9f9f9; padding: 15px; border-radius: var(--border-radius);">
                    <span style="font-weight: bold;">Pickup Location:</span>
                    <span>Main Branch, Alexandria</span>
                </div>

                <div id="daysDisplay" style="text-align: center; font-weight: bold; color: var(--accent-color); display: none;">
                    Total Days: <span id="DaysBetween">0</span>
                </div>

                <a href="#" id="CalculateBtn" class="btn">Proceed to Bill</a>
            </div>
        </div>
    </div>

    <script>
        // Security Check: Only customers can access booking
        window.onload = function() {
            const isCustomer = localStorage.getItem('customerId');
            if (!isCustomer) {
                alert("Please log in as a customer to access the booking system.");
                window.location.href = 'index.html';
                return;
            }
            // Set dynamic booking ID
            document.getElementById('bookingId').textContent = 'GG-' + Math.floor(Math.random() * 1000000);
            updateDays();
        };

        function calculateDays(startDateStr, endDateStr) {
            const start = new Date(startDateStr);
            const end = new Date(endDateStr);
            const diffTime = Math.abs(end - start);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return diffDays || 0;
        }

        document.getElementById("CalculateBtn").addEventListener("click", function(e) {
            e.preventDefault();
            const startDate = document.getElementById("StartDate").value;
            const endDate = document.getElementById("EndDate").value;

            if (!startDate || !endDate) {
                alert("Please select both start and end dates.");
                return;
            }

            const days = calculateDays(startDate, endDate);
            if (days <= 0) {
                alert("End date must be after start date.");
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const carId = urlParams.get('id');
            if (carId) localStorage.setItem("currentRentingCarId", carId);

            localStorage.setItem("DaysBetween", days);
            window.location.href = "index8.html";
        });

        document.getElementById("StartDate").addEventListener("change", updateDays);
        document.getElementById("EndDate").addEventListener("change", updateDays);

        function updateDays() {
            const start = document.getElementById("StartDate").value;
            const end = document.getElementById("EndDate").value;
            if (start && end) {
                const days = calculateDays(start, end);
                const display = document.getElementById("daysDisplay");
                document.getElementById("DaysBetween").textContent = days;
                display.style.display = days > 0 ? "block" : "none";
            }
        }
    </script>
</body>
</html>
