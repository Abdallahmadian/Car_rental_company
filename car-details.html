<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Details - Gear Galaxy</title>
    <link rel="stylesheet" href="global.css">
    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        .gallery img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: transform 0.3s;
        }
        .gallery img:hover {
            transform: scale(1.02);
        }
        .main-photo {
            width: 100%;
            height: 500px;
            object-fit: cover;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
        }
        .details-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="main-container container">
            <a href="index4.html" class="logo">GEAR GALAXY</a>
            <div id="authNav">
                <a href="index4.html">Home</a>
                <a href="index5.html">Rent Now</a>
                <a href="index.html" class="btn" id="loginBtn" style="padding: 8px 20px; margin-left: 20px;">Login</a>
                <span id="userMenu" style="display: none;">
                    <a href="customer-history.html" id="historyLink" style="margin-left: 20px; display: none;">History</a>
                    <a href="owner-dashboard.html" id="dashboardLink" style="margin-left: 20px; display: none;">Dashboard</a>
                    <a href="edit-profile.html" style="margin-left: 20px;">Profile</a>
                    <a href="#" onclick="logout()" class="btn" style="padding: 8px 20px; margin-left: 20px; background-color: var(--secondary-color);">Logout</a>
                </span>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div id="carDetails">
            <!-- Details will be loaded here -->
            <p style="text-align: center; padding: 100px;">Loading car details...</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const carId = urlParams.get('id');

        function checkLogin() {
            const ownerId = localStorage.getItem('currentOwnerId');
            const customerId = localStorage.getItem('customerId');
            const loginBtn = document.getElementById('loginBtn');
            const userMenu = document.getElementById('userMenu');
            const historyLink = document.getElementById('historyLink');
            const dashboardLink = document.getElementById('dashboardLink');

            if (ownerId || customerId) {
                loginBtn.style.display = 'none';
                userMenu.style.display = 'inline';
                if (ownerId) dashboardLink.style.display = 'inline';
                if (customerId) historyLink.style.display = 'inline';
            }
        }

        function logout() {
            localStorage.removeItem('currentOwnerId');
            localStorage.removeItem('ownerName');
            localStorage.removeItem('customerId');
            localStorage.removeItem('customerName');
            window.location.href = 'index.html';
        }

        function loadCarDetails() {
            checkLogin();
            const localCars = JSON.parse(localStorage.getItem('localCars') || '[]');
            const car = localCars.find(c => c.id == carId);

            if (!car) {
                document.getElementById('carDetails').innerHTML = '<h2>Car not found.</h2>';
                return;
            }

            const images = car.images || [car.image_path || 'bmw.jpeg'];
            
            document.getElementById('carDetails').innerHTML = `
                <div class="card">
                    <img src="${images[0]}" class="main-photo" id="mainImg">
                    
                    <div class="gallery">
                        ${images.map((img, i) => `
                            <img src="${img}" onclick="document.getElementById('mainImg').src='${img}'">
                        `).join('')}
                    </div>

                    <div class="details-grid">
                        <div>
                            <h2>${car.brand} ${car.model} (${car.year})</h2>
                            <p style="margin: 20px 0; font-size: 1.1rem; color: #555;">${car.description || 'No description available.'}</p>
                            
                            <div class="card" style="background: #f9f9f9; padding: 20px;">
                                <h3>Specifications</h3>
                                <div class="info-item"><span>Color</span> <strong>${car.color}</strong></div>
                                <div class="info-item"><span>Fuel Type</span> <strong>${car.fuelType || car.fuel_type}</strong></div>
                                <div class="info-item"><span>Transmission</span> <strong>${car.transmission}</strong></div>
                            </div>
                        </div>

                        <div>
                            <div class="card" style="border: 2px solid var(--primary-color); text-align: center;">
                                <p style="font-size: 1.2rem; color: #666;">Daily Rent</p>
                                <h2 style="font-size: 2.5rem; color: var(--primary-color); margin: 10px 0;">$${car.price_per_day || car.pricePerDay}</h2>
                                <div id="rentSection">
                                    <a href="index7.html?id=${car.id}" class="btn" style="display: block; width: 100%; margin-top: 20px;">Rent This Car</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Check user status
            const isOwner = localStorage.getItem('currentOwnerId');
            const isCustomer = localStorage.getItem('customerId');
            const rentSection = document.getElementById('rentSection');
            
            if (car.status === 'rented') {
                rentSection.innerHTML = `
                    <div style="background: #fff3cd; color: #856404; padding: 20px; border-radius: var(--border-radius); text-align: center; font-weight: 600; margin-top: 20px; border: 1px solid rgba(133, 100, 4, 0.1);">
                        This car is currently rented and unavailable.
                    </div>
                `;
            } else if (isOwner) {
                rentSection.innerHTML = `
                    <div style="background: #fff3cd; color: #856404; padding: 15px; border-radius: 8px; font-size: 0.9rem; margin-top: 20px;">
                        <strong>Notice:</strong> Owners cannot rent cars. Please log in as a Customer.
                    </div>
                `;
            } else if (!isCustomer) {
                rentSection.innerHTML = `
                    <div style="margin-top: 20px;">
                        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px;">Please log in as a customer to rent this vehicle.</p>
                        <a href="index.html" class="btn btn-secondary" style="display: block; width: 100%;">Login to Rent</a>
                    </div>
                `;
            }
        }

        window.onload = loadCarDetails;
    </script>
</body>
</html>
