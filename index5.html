<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent Now - Gear Galaxy</title>
    <link rel="stylesheet" href="global.css">
</head>
<body>
    <nav class="navbar">
        <div class="main-container container">
            <a href="index4.html" class="logo">GEAR GALAXY</a>
            <div id="authNav">
                <a href="index4.html">Home</a>
                <a href="index5.html" class="active">Rent Now</a>
                <a href="index3.html" id="navOwnerBtn">Owner Portal</a>
                <a href="index.html" class="btn" id="loginBtn" style="padding: 8px 20px; margin-left: 20px;">Login</a>
                <span id="userMenu" style="display: none;">
                    <a href="customer-history.html" id="navHistoryLink" style="margin-left: 20px; display: none;">History</a>
                    <a href="edit-profile.html" style="margin-left: 20px;">Edit Profile</a>
                    <a href="#" onclick="logout()" class="btn" style="padding: 8px 20px; margin-left: 20px; background-color: var(--secondary-color);">Logout</a>
                </span>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <h2 style="margin: 40px 0;">Available Cars for Rent</h2>
        
        <div id="carsGrid" class="grid">
            <!-- Cars will be loaded here dynamically -->
            <div style="text-align: center; grid-column: 1 / -1; padding: 50px;">
                <p>Loading cars...</p>
            </div>
        </div>
    </div>

    <script>
        function checkLogin() {
            const ownerId = localStorage.getItem('currentOwnerId');
            const customerId = localStorage.getItem('customerId');
            const loginBtn = document.getElementById('loginBtn');
            const userMenu = document.getElementById('userMenu');
            const navOwnerBtn = document.getElementById('navOwnerBtn');
            const navHistoryLink = document.getElementById('navHistoryLink');

            if (ownerId) {
                loginBtn.style.display = 'none';
                userMenu.style.display = 'inline';
                if (navOwnerBtn) {
                    navOwnerBtn.href = 'owner-dashboard.html';
                    navOwnerBtn.textContent = 'Owner Dashboard';
                }
            } else if (customerId) {
                loginBtn.style.display = 'none';
                userMenu.style.display = 'inline';
                if (navHistoryLink) navHistoryLink.style.display = 'inline';
                if (navOwnerBtn) navOwnerBtn.style.display = 'none';
            }
        }

        function logout() {
            localStorage.removeItem('currentOwnerId');
            localStorage.removeItem('ownerName');
            localStorage.removeItem('customerId');
            localStorage.removeItem('customerName');
            window.location.href = 'index.html';
        }

        async function loadCars() {
            checkLogin();
            const grid = document.getElementById('carsGrid');
            try {
                // Fetch from backend
                let data = [];
                try {
                    const response = await fetch('http://127.0.0.1:3000/api/cars');
                    if (response.ok) {
                        data = await response.json();
                    }
                } catch (e) {
                    console.log("Backend offline, loading local cars only.");
                }

                // Load local storage cars
                const localCars = JSON.parse(localStorage.getItem('localCars') || '[]');
                const allCars = [...data, ...localCars];

                if (allCars.length === 0) {
                    grid.innerHTML = '<div style="text-align: center; grid-column: 1 / -1; padding: 50px;"><h3>No cars available at the moment.</h3></div>';
                    return;
                }

                grid.innerHTML = allCars.map(car => {
                    const isRented = car.status === 'rented';
                    return `
                        <div class="car-card" style="${isRented ? 'opacity: 0.8;' : ''}">
                            <div style="position: relative;">
                                <img src="${(car.images && car.images[0]) || car.image_path || 'bmw.jpeg'}" alt="${car.brand} ${car.model}" onerror="this.src='bmw.jpeg'">
                                ${isRented ? `
                                    <div style="position: absolute; top: 15px; right: 15px;">
                                        <span class="badge badge-rented">Rented</span>
                                    </div>
                                ` : `
                                    <div style="position: absolute; top: 15px; right: 15px;">
                                        <span class="badge badge-available">Available</span>
                                    </div>
                                `}
                            </div>
                            <div class="car-info">
                                <h3 style="margin-bottom: 10px;">${car.brand} ${car.model}</h3>
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
                                    <span class="price-tag">$${car.price_per_day || car.price || car.pricePerDay} <span style="font-size: 14px; color: var(--text-muted); font-weight: normal;">/ day</span></span>
                                    ${isRented ? `
                                        <a href="car-details.html?id=${car.id}" class="btn btn-secondary" style="padding: 8px 20px; font-size: 14px;">View Details</a>
                                    ` : `
                                        <a href="car-details.html?id=${car.id}" class="btn" style="padding: 8px 20px; font-size: 14px;">Rent Now</a>
                                    `}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('Error loading cars:', error);
                grid.innerHTML = '<div style="text-align: center; grid-column: 1 / -1; padding: 50px;"><h3 style="color: var(--primary-color);">Failed to load cars. Please try again later.</h3></div>';
            }
        }

        window.onload = loadCars;
    </script>
</body>
</html>
